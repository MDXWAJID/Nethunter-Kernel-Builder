name: "Build kernels"

env:
  CONFIGURATION: "repos.json"
  OUT_DIR: "out"

on:
  workflow_dispatch:

jobs:
  Set-repos:
    name: "🐂 Parse repos.json"
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.generate-matrix.outputs.repos }}
    steps:
      - name: "😄 Checkout"
        uses: actions/checkout@v4

      - name: "😆 Generate Matrix"
        id: generate-matrix
        run: |
          echo "repos<<EOF" >> $GITHUB_OUTPUT
          cat ${{ env.CONFIGURATION }} >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  Build-Kernel:
    name: "🐎 Build kernel"
    runs-on: ubuntu-latest
    needs:
      - Set-repos
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        repos: ${{ fromJSON(needs.Set-repos.outputs.repos) }}
    env:
      kernelDir: ${{ matrix.repos.kernelSource.name }}_${{ matrix.repos.kernelSource.device }}
      kernelName: ${{ matrix.repos.kernelSource.name }}
      kernelRepo: ${{ matrix.repos.kernelSource.repo }}
      kernelBranch: ${{ matrix.repos.kernelSource.branch }}
      kernelDevice: ${{ matrix.repos.kernelSource.device }}
      DEFCONFIG_NAME: ${{ matrix.repos.kernelSource.device }}_defconfig
      withKernelSU: ${{ matrix.repos.withKernelSU }}

    steps:
      - name: "✨ Create working dir"
        run: mkdir -p $kernelDir

      - name: "⭐ Install prerequisites"
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc curl git zip ftp gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev lftp zstd wget libfl-dev python3 python-is-python3 libarchive-tools jq

      - name: "🌟 Clone kernel source"
        working-directory: ./${{ env.kernelDir }}
        run: |
          git clone --recursive --branch $kernelBranch $kernelRepo $kernelName --depth=1

      - name: "💫 Get toolchains"
        working-directory: ./${{ env.kernelDir }}
        env:
          toolchains: "${{ toJSON(matrix.repos.toolchains) }}"
        run: |
          toolchains_num="$(echo $toolchains | jq 'length')"
          for ((i=0;i<toolchains_num;i++)); do
            name=$(echo $toolchains | jq -r ".[$i].name")
            repo=$(echo $toolchains | jq -r ".[$i].repo")
            branch=$(echo $toolchains | jq -r ".[$i].branch")
            git clone --recursive --branch $branch $repo $name --depth=1
            if [ -f "$(pwd)/$name/bin/ld" ]; then
              mv "$(pwd)/$name/bin/ld" "$(pwd)/$name/bin/ld.disabled"
              echo "Disabled incompatible toolchain ld."
            fi
            echo "$(pwd)/$name/" >> $GITHUB_PATH
            echo "$(pwd)/$name/bin" >> $GITHUB_PATH
          done
          echo "PATH Variable: $PATH"

      - name: "😎 Set args"
        id: generate-args
        working-directory: ./${{ env.kernelDir }}
        env:
          params: "${{ toJSON(matrix.repos.params) }}"
        run: |
          ARCH=$(echo $params | jq -r ".ARCH // empty")
          CROSS_COMPILE=$(echo $params | jq -r ".CROSS_COMPILE // empty")
          CROSS_COMPILE_COMPAT=$(echo $params | jq -r ".CROSS_COMPILE_COMPAT // empty")
          CROSS_COMPILE_ARM32=$(echo $params | jq -r ".CROSS_COMPILE_ARM32 // empty")
          CLANG_TRIPLE=$(echo $params | jq -r ".CLANG_TRIPLE // empty")
          AR=$(echo $params | jq -r ".AR // empty")
          CC=$(echo $params | jq -r ".CC // empty")
          LD=$(echo $params | jq -r ".LD // empty")

          echo "ARCH=$ARCH" >> $GITHUB_ENV
          args="-j$(nproc --all)"
          if [ -n "${{ env.OUT_DIR }}" ]; then
            mkdir -p $(pwd)/${{ env.OUT_DIR }}
            args="$args O=$(pwd)/${{ env.OUT_DIR }}"
          fi
          [ -n "$ARCH" ] && args="$args ARCH=$ARCH"
          [ -n "$CROSS_COMPILE" ] && args="$args CROSS_COMPILE=$CROSS_COMPILE"
          [ -n "$CLANG_TRIPLE" ] && args="$args CLANG_TRIPLE=$CLANG_TRIPLE"
          [ -n "$CROSS_COMPILE_COMPAT" ] && args="$args CROSS_COMPILE_ARM32=$CROSS_COMPILE_COMPAT"
          [ -n "$AR" ] && args="$args AR=$AR"
          [ -n "$CC" ] && args="$args CC=$CC"
          [ -n "$LD" ] && args="$args LD=$LD"
          echo "args=$args" >> $GITHUB_OUTPUT

      - name: "👍 Make defconfig"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        env:
          args: ${{ steps.generate-args.outputs.args }}
        run: |
          if [[ "${{ env.DEFCONFIG_NAME }}" == *"/"* ]]; then
            dir_path=$(dirname "${{ env.DEFCONFIG_NAME }}")
            file_name=$(basename "${{ env.DEFCONFIG_NAME }}")
            cp arch/${{ env.ARCH }}/configs/${dir_path}/${file_name} arch/${{ env.ARCH }}/configs/${file_name}
            make ${{ env.args }} ${file_name}
          else
            make ${{ env.args }} ${{ env.DEFCONFIG_NAME }}
          fi

      - name: "🏴‍☠️ Inject NetHunter & AR9271 Modules"
        env:
          args: ${{ steps.generate-args.outputs.args }}
          extraParams: ${{ toJSON(matrix.repos.extraParams) }}
        working-directory: ./${{ env.kernelDir }}/${{ env.OUT_DIR }}
        run: |
          echo "$extraParams" | jq -r 'to_entries[] | select(.value != null) | "\(.key)=\(.value)"' >> .config
          make ${{ env.args }} olddefconfig
          echo "--- Locked NetHunter configs ---"
          grep -E "CONFIG_(ATH9K_HTC|MAC80211|CFG80211|USB_OTG|UHID|LEDS_CLASS|USB_USBNET|LOCALVERSION)=" .config || true

      - name: "🎶 Build kernel"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        env:
          args: ${{ steps.generate-args.outputs.args }}
        run: |
          echo ">>> Starting main make..."
          make ${args} 2>&1 | tee ../build.log
          echo ">>> Starting Image make..."
          make ${args} Image 2>&1 | tee -a ../build.log
          echo ">>> Starting Image.gz make..."
          make ${args} Image.gz 2>&1 | tee -a ../build.log
          echo ">>> Starting dtbs make..."
          make ${args} dtbs 2>&1 | tee -a ../build.log
          
          OUT=${{ env.OUT_DIR }}
          echo "=============== BOOT DIR ==============="
          ls -la $OUT/arch/arm64/boot/ || true
          
          if [ ! -s $OUT/arch/arm64/boot/Image ] && [ -s $OUT/vmlinux ]; then
            echo ">>> Carving Image from vmlinux..."
            aarch64-linux-gnu-objcopy -O binary -R .note -R .note.gnu.build-id -R .comment -S $OUT/vmlinux $OUT/arch/arm64/boot/Image
          fi
          if [ ! -s $OUT/arch/arm64/boot/Image.gz ] && [ -s $OUT/arch/arm64/boot/Image ]; then
            gzip -n -c -9 $OUT/arch/arm64/boot/Image > $OUT/arch/arm64/boot/Image.gz
          fi
          
          echo ">>> Final Boot Dir State:"
          ls -la $OUT/arch/arm64/boot/ || true

      - name: "🚨 Upload build.log ON FAILURE"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BUILD-LOG-READ-ME
          path: ./${{ env.kernelDir }}/build.log
          if-no-files-found: error
          retention-days: 7
